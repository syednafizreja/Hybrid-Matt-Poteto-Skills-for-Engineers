<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Agentic Harness for Engineers</title>
  <desc id="hero-description">A model-agnostic engineering workflow: investigate, plan, build, and verify. Optimized for Engineers by Engineers.</desc>
  <defs>
    <linearGradient id="bg" x1="30" y1="0" x2="1170" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D1A"/>
      <stop offset=".55" stop-color="#11172B"/>
      <stop offset="1" stop-color="#21133A"/>
    </linearGradient>
    <linearGradient id="accent" x1="100" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#151E34"/>
      <stop offset="1" stop-color="#101729"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#A5B4FC" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <style>
    .signal {
      animation: signal 6s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes signal {
      0% { opacity: .35; transform: translateX(0); }
      100% { opacity: 1; transform: translateX(900px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal { animation: none; opacity: .7; }
    }
  </style>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="95" cy="55" r="190" fill="#22D3EE" fill-opacity=".08"/>
  <circle cx="1115" cy="515" r="250" fill="#A855F7" fill-opacity=".1"/>

  <text x="82" y="74" fill="#A5B4FC" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">MODEL-AGNOSTIC / HUMAN-LED / EVIDENCE-FIRST</text>
  <text x="80" y="156" fill="#F8FAFC" font-family="Inter,Segoe UI,sans-serif" font-size="46" font-weight="750" letter-spacing="-1.5">Agentic Harness for Engineers</text>
  <text x="83" y="199" fill="#AAB6CC" font-family="Inter,Segoe UI,sans-serif" font-size="19">Optimized for Engineers by Engineers</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="82" y="229" width="440" height="39" rx="19.5" fill="#0C1426" stroke="#34415B"/>
    <circle cx="105" cy="248.5" r="4" fill="#34D399"/>
    <text x="121" y="253" fill="#CFD8E8" font-size="13" font-weight="600">IDE</text>
    <text x="188" y="253" fill="#526079" font-size="13">/</text>
    <text x="208" y="253" fill="#CFD8E8" font-size="13" font-weight="600">CLI</text>
    <text x="270" y="253" fill="#526079" font-size="13">/</text>
    <text x="290" y="253" fill="#CFD8E8" font-size="13" font-weight="600">CI</text>
    <text x="342" y="253" fill="#526079" font-size="13">/</text>
    <text x="362" y="253" fill="#8793AA" font-size="13">ANY AGENT</text>
  </g>

  <path d="M148 462H1052" stroke="#485574" stroke-opacity=".7" stroke-width="2"/>
  <path d="M148 462H1052" stroke="url(#accent)" stroke-opacity=".7" stroke-width="2"/>
  <circle class="signal" cx="148" cy="462" r="7" fill="#67E8F9" filter="url(#soft-glow)"/>

  <g font-family="Inter,Segoe UI,sans-serif">
    <rect x="82" y="321" width="236" height="116" rx="18" fill="url(#panel)" stroke="#22D3EE" stroke-opacity=".5"/>
    <circle cx="112" cy="358" r="5" fill="#22D3EE"/>
    <text x="132" y="363" fill="#67E8F9" font-size="12" font-weight="700" letter-spacing="1.5">01 / CONTEXT</text>
    <text x="108" y="403" fill="#F1F5F9" font-size="18" font-weight="650">Investigate</text>

    <rect x="354" y="321" width="236" height="116" rx="18" fill="url(#panel)" stroke="#818CF8" stroke-opacity=".55"/>
    <circle cx="384" cy="358" r="5" fill="#818CF8"/>
    <text x="404" y="363" fill="#A5B4FC" font-size="12" font-weight="700" letter-spacing="1.5">02 / INTENT</text>
    <text x="380" y="403" fill="#F1F5F9" font-size="18" font-weight="650">Plan</text>

    <rect x="626" y="321" width="236" height="116" rx="18" fill="url(#panel)" stroke="#A78BFA" stroke-opacity=".55"/>
    <circle cx="656" cy="358" r="5" fill="#A78BFA"/>
    <text x="676" y="363" fill="#C4B5FD" font-size="12" font-weight="700" letter-spacing="1.5">03 / CHANGE</text>
    <text x="652" y="403" fill="#F1F5F9" font-size="18" font-weight="650">Build</text>

    <rect x="898" y="321" width="220" height="116" rx="18" fill="url(#panel)" stroke="#C084FC" stroke-opacity=".6"/>
    <circle cx="928" cy="358" r="5" fill="#C084FC"/>
    <text x="948" y="363" fill="#E9D5FF" font-size="12" font-weight="700" letter-spacing="1.5">04 / EVIDENCE</text>
    <text x="924" y="403" fill="#F1F5F9" font-size="18" font-weight="650">Verify</text>
  </g>

  <path d="M82 483H1118" stroke="#FFFFFF" stroke-opacity=".1"/>
  <text x="82" y="517" fill="#8491A9" font-family="Inter,Segoe UI,sans-serif" font-size="13">Small diffs</text>
  <circle cx="166" cy="512" r="2" fill="#526079"/>
  <text x="184" y="517" fill="#8491A9" font-family="Inter,Segoe UI,sans-serif" font-size="13">Real tests</text>
  <circle cx="270" cy="512" r="2" fill="#526079"/>
  <text x="288" y="517" fill="#8491A9" font-family="Inter,Segoe UI,sans-serif" font-size="13">Runtime proof</text>
  <text x="1118" y="517" fill="#66748D" font-family="Inter,Segoe UI,sans-serif" font-size="12" letter-spacing="1.6" text-anchor="end">OPEN SOURCE / MODULAR / ENGINEER-LED</text>
  <text x="1118" y="542" fill="#8491A9" font-family="Inter,Segoe UI,sans-serif" font-size="10" letter-spacing="1.2" text-anchor="end">@syednafizreja</text>
</svg>
