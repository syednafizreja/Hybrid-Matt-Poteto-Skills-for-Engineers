name: Weekly upstream skill sync

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: upstream-skill-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate sync tooling
        run: |
          node --test tools/maintainers/upstream-sync.test.mjs
          node tools/maintainers/sync-upstream-skills.mjs --check-config
          node verify-library.mjs
          node scripts/check-boundaries.mjs

      - name: Select update branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prs="$(gh pr list --base main --state open --json headRefName --limit 100)"
          branch="$(printf '%s' "$prs" | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk).on("end", () => { const pr = JSON.parse(input).find((item) => item.headRefName.startsWith("automation/upstream-skill-sync-")); process.stdout.write(pr ? pr.headRefName : ""); });')"
          if [ -z "${branch}" ]; then
            branch="automation/upstream-skill-sync-${GITHUB_RUN_ID}"
          fi
          echo "name=${branch}" >> "$GITHUB_OUTPUT"

      - name: Prepare update branch
        env:
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git fetch origin main
          if git ls-remote --exit-code origin "refs/heads/${UPDATE_BRANCH}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${UPDATE_BRANCH}:refs/remotes/origin/${UPDATE_BRANCH}"
            git switch --force-create "${UPDATE_BRANCH}" "origin/${UPDATE_BRANCH}"
            git merge --no-edit origin/main
          else
            git switch --create "${UPDATE_BRANCH}" origin/main
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream skill updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/maintainers/sync-upstream-skills.mjs

      - name: Refresh factory ZIP
        run: python tools/maintainers/build-factory-zip.py

      - name: Verify merged updates
        run: |
          git diff --check
          node --test tools/maintainers/upstream-sync.test.mjs
          node tools/maintainers/sync-upstream-skills.mjs --check-config
          node verify-library.mjs
          node scripts/check-boundaries.mjs

      - name: Commit and push update branch
        id: commit
        env:
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git commit -m "Sync upstream engineering skills"
          git push origin "${UPDATE_BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update draft PR
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          body="Automated weekly review of Matt Pocock and Open PStack skill updates. Review the diff and .github/upstream-update-report.md, especially any conflict or new-skill candidates. Verification ran before this PR was opened. This PR is draft-only and is never auto-merged."
          prs="$(gh pr list --head "${UPDATE_BRANCH}" --base main --state open --json number)"
          pr_number="$(printf '%s' "$prs" | node -e 'let input = ""; process.stdin.on("data", (chunk) => input += chunk).on("end", () => { const items = JSON.parse(input); process.stdout.write(items.length ? String(items[0].number) : ""); });')"
          if [ -n "${pr_number}" ]; then
            gh pr edit "${pr_number}" --title "Sync upstream engineering skills" --body "${body}"
          else
            gh pr create --draft --head "${UPDATE_BRANCH}" --base main --title "Sync upstream engineering skills" --body "${body}"
          fi

      - name: Dispatch deterministic CI for the update branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_BRANCH: ${{ steps.branch.outputs.name }}
        run: gh workflow run deterministic-ci.yml --ref "${UPDATE_BRANCH}"
