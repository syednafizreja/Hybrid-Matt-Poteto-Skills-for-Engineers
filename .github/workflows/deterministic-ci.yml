name: Hybrid Deterministic CI (Layer-2 Guardrails)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer2-boundaries:
    name: Layer-2 Import Boundaries & Anti-Slop Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run check-boundaries.mjs
        run: node scripts/check-boundaries.mjs

  node-checks:
    name: TypeScript / Node Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect package.json
        id: detect
        run: |
          if [ -f "package.json" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.detect.outputs.enabled == 'true'
        run: npm ci
      - if: steps.detect.outputs.enabled == 'true'
        run: |
          npm run typecheck --if-present
          npm run lint --if-present
          npm test --if-present

  python-checks:
    name: Python Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python project
        id: detect
        run: |
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.enabled == 'true'
        with:
          python-version: "3.12"
      - if: steps.detect.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f "pyproject.toml" ]; then pip install -e ".[dev]" || pip install -e .; fi
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          pip install ruff mypy pytest
      - if: steps.detect.outputs.enabled == 'true'
        run: |
          ruff check .
          mypy . --ignore-missing-imports
          pytest -q
